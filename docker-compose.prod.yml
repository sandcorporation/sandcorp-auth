# Production compose. Jenkins runs it on oracle with docker-compose.oracle.yml layered on top
# (COMPOSE_PROJECT_NAME=sandcorp-auth). Secrets come from ./.env in the Jenkins workspace, never the repo.
name: sandcorp-auth

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandcorp-auth-web:latest
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18093}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Hits /api/health (which round-trips to Postgres) with the first allowed host as Host header.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u;h=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0].strip();u.urlopen(u.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}),timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    cpus: 0.6
    mem_limit: 512m
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sandcorp_auth}
      POSTGRES_USER: ${POSTGRES_USER:-sandcorp_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 0.4
    mem_limit: 384m
    restart: unless-stopped

volumes:
  pgdata:
