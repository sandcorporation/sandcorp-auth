# Production compose. Jenkins runs it on oracle with docker-compose.oracle.yml layered on top
# (COMPOSE_PROJECT_NAME=sandcorp-auth). Secrets come from ./.env in the Jenkins workspace, never the repo.
# The database is OCI MySQL HeatWave outside compose (private IP in the same VCN): web reads DB_* from
# .env. `make prod-local` layers docker-compose.prod-local.yml, which adds a local MySQL.
name: sandcorp-auth

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AUTH_IMAGE:-sandcorp-auth-web:latest}
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18093}:8000"
    # Hits /api/health (which round-trips to the database) with the first allowed host as Host header.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u;h=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0].strip();u.urlopen(u.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}),timeout=5)"
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    cpus: 0.6
    mem_limit: 512m
    restart: unless-stopped
