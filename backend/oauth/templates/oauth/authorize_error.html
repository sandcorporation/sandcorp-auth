{% extends "accounts/base.html" %}
{% block title %}잘못된 인가 요청{% endblock %}
{% block content %}
<h1>잘못된 인가 요청</h1>
<p class="lead">클라이언트나 돌아갈 주소(redirect_uri)를 확인할 수 없어 클라이언트로 돌려보내지 않았습니다. 요청한 프로그램의 설정을 확인하세요.</p>
<div class="error" role="alert"><code>{{ error }}</code>{% if description %} — {{ description }}{% endif %}</div>
{% endblock %}
