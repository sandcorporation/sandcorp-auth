[project]
name = "sandcorp-auth-backend"
version = "0.1.0"
description = "Sandcorp auth service (Django + django-ninja)"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "gunicorn>=26.2.0",
    "pydantic>=2.13.0",
    "whitenoise>=6.12.0",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "pyotp>=2.10.0",
    "qrcode>=8.2",
    "authlib>=1.9.1,<1.10",
    "mysqlclient>=2.3.0",
    "sentry-sdk[django]>=2.74.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "types-qrcode>=8.2.0.20260518",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# authlib ships no type hints; our subclasses (oauth/server.py, oauth/models.py) type their
# own method signatures.
module = ["authlib.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.test_settings"
