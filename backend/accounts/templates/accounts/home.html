{% extends "accounts/base.html" %}
{% block title %}로그인됨{% endblock %}
{% block content %}
<h1>로그인됨</h1>
<p class="auth-lead">{{ user.get_username }} 계정으로 로그인되어 있습니다.</p>
<div class="auth-stack">
  <a class="sc-btn sc-btn--accent sc-btn--block" href="{{ admin_path }}">관리 화면으로</a>
  <form method="post" action="/logout">{% csrf_token %}<button class="sc-btn sc-btn--secondary sc-btn--block" type="submit">로그아웃</button></form>
</div>
{% endblock %}
