<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}로그인{% endblock %} · Sandcorp 인증</title>
<style>
  :root { --bg: #f5f5f4; --card: #fff; --text: #1c1917; --muted: #57534e; --line: #d6d3d1;
          --accent: #1d4ed8; --error-bg: #fef2f2; --error: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --card: #292524; --text: #f5f5f4; --muted: #a8a29e; --line: #44403c;
            --accent: #60a5fa; --error-bg: #450a0a; --error: #fca5a5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--text); padding: 16px; word-break: keep-all;
         font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
         border-radius: 12px; padding: 28px 24px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  label { display: block; font-size: .9rem; margin: 12px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px 12px; font-size: 1rem;
         border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  input.code { letter-spacing: .3em; font-variant-numeric: tabular-nums; text-align: center; }
  button { margin-top: 20px; width: 100%; padding: 11px; font-size: 1rem; border: 0;
           border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button.link { background: none; color: var(--muted); width: auto; margin-top: 12px; padding: 0;
                text-decoration: underline; font-size: .9rem; }
  .error { background: var(--error-bg); color: var(--error); padding: 10px 12px;
           border-radius: 8px; font-size: .9rem; margin-bottom: 8px; }
  .qr { background: #fff; border-radius: 8px; padding: 8px; text-align: center; }
  .qr svg { width: 200px; height: 200px; }
  code.secret { display: block; word-break: break-all; font-size: .9rem; padding: 8px;
                border: 1px dashed var(--line); border-radius: 8px; margin-top: 4px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
