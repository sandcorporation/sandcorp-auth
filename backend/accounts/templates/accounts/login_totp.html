{% extends "accounts/base.html" %}
{% block title %}인증 코드{% endblock %}
{% block content %}
<h1>인증 코드</h1>
<p class="lead">인증 앱에 뜬 6자리 코드를 넣어 주세요.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post">
  {% csrf_token %}
  <label for="code">코드</label>
  <input type="text" class="code" id="code" name="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" required autofocus>
  <button type="submit">로그인</button>
</form>
<form method="post" action="/logout">{% csrf_token %}<button type="submit" class="link">처음으로</button></form>
{% endblock %}
