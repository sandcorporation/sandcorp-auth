{% extends "accounts/base.html" %}
{% block title %}관리자 로그인 필요{% endblock %}
{% block content %}
<h1>관리자 계정이 아닙니다</h1>
{% if who %}<p class="auth-meta-text" data-slot="current-account">{{ who }}</p>{% endif %}
<form method="post" action="/logout" data-slot="relogin-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ relogin_next }}">
  <button class="sc-btn sc-btn--accent sc-btn--block auth-subtle" type="submit">관리자 계정으로 다시 로그인</button>
</form>
{% endblock %}
