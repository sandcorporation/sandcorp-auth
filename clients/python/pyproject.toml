[project]
name = "sandcorp-authkit"
version = "0.2.0"
description = "Resource-server side of Sandcorp auth: token validation, RFC 9728 metadata, Django bearer and operator login"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
# Only `sandcorp_authkit.django` needs these; every other module works without them.
django = [
    "django>=6.1",
    "django-ninja>=1.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcorp_authkit"]

[dependency-groups]
dev = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
