[project]
name = "sandcorp-authkit"
version = "0.1.0"
description = "Resource-server side of Sandcorp auth: access-token validation and RFC 9728 metadata"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
# T2 fills this (Django·django-ninja integration). Empty on purpose for 0.1.0.
django = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcorp_authkit"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
